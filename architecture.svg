<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1150" viewBox="0 0 1000 1150" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <g id="upArrow">
      <line x1="0" y1="70" x2="0" y2="14" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
      <polygon points="-10,20 0,0 10,20" fill="#94a3b8"/>
    </g>
    <g id="downArrow">
      <line x1="0" y1="0" x2="0" y2="56" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
      <polygon points="-10,50 0,70 10,50" fill="#94a3b8"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1000" height="1150" fill="#ffffff"/>

  <!-- title -->
  <text x="400" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f172a">Unifycom 分层架构</text>
  <text x="400" y="80" text-anchor="middle" font-size="14" fill="#64748b">统一通信编程框架 · 事件驱动</text>

  <!-- ===================== L4 ===================== -->
  <rect x="70" y="110" width="660" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="70" y="110" width="8" height="140" rx="4" fill="#3b82f6"/>
  <text x="98" y="142" font-size="16" font-weight="bold" fill="#1d4ed8">Application · 应用层</text>
  <rect x="210" y="170" width="380" height="48" rx="8" fill="#3b82f6"/>
  <text x="400" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">XxxEventHandler</text>

  <!-- gap L4/L3 -->
  <use xlink:href="#upArrow" x="240" y="260"/>
  <text x="255" y="300" font-size="14" fill="#475569">Inbound Event</text>
  <use xlink:href="#downArrow" x="560" y="260"/>
  <text x="575" y="300" font-size="14" fill="#475569">Event Result</text>

  <!-- ===================== L3 ===================== -->
  <rect x="70" y="340" width="310" height="76" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">MessageToEventDecoder</text>
  <text x="225" y="396" text-anchor="middle" font-size="12" fill="#7c6aae">报文 → 事件（用户实现）</text>
  <rect x="420" y="340" width="310" height="76" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="575" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">ResultToMessageEncoder</text>
  <text x="575" y="396" text-anchor="middle" font-size="12" fill="#7c6aae">事件结果 → 报文（用户实现）</text>

  <!-- gap L3/L2 -->
  <use xlink:href="#upArrow" x="240" y="426"/>
  <text x="255" y="466" font-size="14" fill="#475569">Inbound Message</text>
  <use xlink:href="#downArrow" x="560" y="426"/>
  <text x="575" y="466" font-size="14" fill="#475569">Outbound Message</text>

  <!-- ===================== L2 ===================== -->
  <rect x="70" y="506" width="660" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="538" text-anchor="middle" font-size="17" font-weight="bold" fill="#065f46">ChannelDispatcher</text>
  <text x="400" y="562" text-anchor="middle" font-size="12" fill="#047857">DefaultChannelDispatcher / AbstractQueueableChannelDispatcher · 分组并行调度</text>

  <!-- gap L2/L1 -->
  <use xlink:href="#upArrow" x="240" y="596"/>
  <text x="255" y="636" font-size="14" fill="#475569">Inbound Message</text>
  <use xlink:href="#downArrow" x="560" y="596"/>
  <text x="575" y="636" font-size="14" fill="#475569">Outbound Message</text>

  <!-- ===================== L1 ===================== -->
  <rect x="70" y="676" width="310" height="170" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="225" y="706" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">XxxChannelDecoder</text>
  <rect x="95" y="724" width="260" height="38" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="225" y="748" text-anchor="middle" font-size="13" fill="#b45309">MessageToMessageDecoder（可选）</text>
  <rect x="95" y="772" width="260" height="38" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="225" y="796" text-anchor="middle" font-size="13" fill="#b45309">ByteToMessageDecoder</text>
  <text x="225" y="834" text-anchor="middle" font-size="11" fill="#b45309">用户实现 · 内置部分通用解码器</text>

  <rect x="420" y="676" width="310" height="170" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="575" y="706" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">XxxChannelEncoder</text>
  <rect x="445" y="772" width="260" height="38" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="575" y="796" text-anchor="middle" font-size="13" fill="#b45309">MessageToByteEncoder</text>
  <text x="575" y="834" text-anchor="middle" font-size="11" fill="#b45309">用户实现</text>

  <!-- gap L1/L0 -->
  <use xlink:href="#upArrow" x="240" y="856"/>
  <text x="255" y="896" font-size="14" fill="#475569">0/1 字节流</text>
  <use xlink:href="#downArrow" x="560" y="856"/>
  <text x="575" y="896" font-size="14" fill="#475569">0/1 字节流</text>

  <!-- ===================== L0 ===================== -->
  <rect x="70" y="926" width="660" height="150" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="98" y="956" font-size="16" font-weight="bold" fill="#334155">Channel · 通讯层</text>
  <rect x="100" y="972" width="280" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="240" y="996" text-anchor="middle" font-size="13" fill="#64748b">Client</text>
  <rect x="130" y="1008" width="220" height="36" rx="6" fill="#64748b"/>
  <text x="240" y="1031" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">XxxChannel</text>
  <rect x="420" y="972" width="280" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="560" y="996" text-anchor="middle" font-size="13" fill="#64748b">Server</text>
  <rect x="450" y="1008" width="220" height="36" rx="6" fill="#64748b"/>
  <text x="560" y="1031" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">XxxServerChannel</text>

  <!-- ===================== layer badges ===================== -->
  <line x1="730" y1="180" x2="780" y2="180" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <rect x="780" y="158" width="190" height="44" rx="12" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="875" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">L4 · 应用层</text>

  <line x1="730" y1="378" x2="780" y2="378" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <rect x="780" y="356" width="190" height="44" rx="12" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="875" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">L3 · 事件编解码</text>

  <line x1="730" y1="546" x2="780" y2="546" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <rect x="780" y="524" width="190" height="44" rx="12" fill="#10b981" filter="url(#shadow)"/>
  <text x="875" y="552" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">L2 · 报文分发</text>

  <line x1="730" y1="761" x2="780" y2="761" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <rect x="780" y="739" width="190" height="44" rx="12" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="875" y="767" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">L1 · 报文编解码</text>

  <line x1="730" y1="1001" x2="780" y2="1001" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <rect x="780" y="979" width="190" height="44" rx="12" fill="#64748b" filter="url(#shadow)"/>
  <text x="875" y="1007" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">L0 · 通讯层</text>

  <!-- ===================== legend ===================== -->
  <text x="120" y="1116" font-size="13" fill="#475569">▲ 上行 Inbound：字节流 → 报文 → 事件</text>
  <text x="540" y="1116" font-size="13" fill="#475569">▼ 下行 Outbound：事件结果 → 报文 → 字节流</text>
</svg>
